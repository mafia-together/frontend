name: Dev CI/CD

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on:
      group: Default
      labels: [self-hosted, dev]
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build
        env:
          VITE_DOMAIN: ${{ secrets.VITE_DOMAIN_DEV }}

      - name: 빌드 파일
        run: cp -rf ./dist ~/
