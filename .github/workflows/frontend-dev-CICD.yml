name: Build Test

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: 빌드 파일 deploy 파일로 이동
        run: cp -f /dist /home/ubuntu/dist